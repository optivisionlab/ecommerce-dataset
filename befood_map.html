<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bản đồ quán ăn beFood</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241608;
    --paper:#fbf2e3;
    --paper-2:#f3e4c9;
    --chili:#d5451b;
    --chili-dark:#a8330f;
    --turmeric:#f2a007;
    --leaf:#3e7a4d;
    --line:#e2c99b;
    --card:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Be Vietnam Pro',sans-serif;background:var(--paper);color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    padding:14px 20px 12px;
    background:linear-gradient(180deg,#2a1a0c 0%, #241608 100%);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:4px solid var(--chili);
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    margin:0;
    letter-spacing:0.5px;
  }
  .brand h1 span{color:var(--turmeric);}
  .brand .sub{font-size:11.5px;color:#d8c6a8;font-weight:400;}

  .citytabs{display:flex;gap:6px;background:#3a2412;padding:4px;border-radius:10px;}
  .citytabs button{
    border:none;background:transparent;color:#e7d6b6;
    padding:8px 16px;border-radius:7px;font-family:'Space Grotesk',sans-serif;
    font-size:13px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .citytabs button.active{background:var(--chili);color:#fff;}
  .citytabs button:hover:not(.active){background:#4d3018;}

  #main{flex:1;display:flex;min-height:0;position:relative;}

  #sidebar{
    width:280px;min-width:280px;
    background:var(--card);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:16px 14px 30px;
  }
  #sidebar h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:#8a6b3b;margin:18px 0 8px;
  }
  #sidebar h2:first-of-type{margin-top:0;}

  .stat-row{display:flex;gap:8px;margin-bottom:4px;}
  .stat-box{
    flex:1;background:var(--paper-2);border-radius:10px;padding:10px 10px;
    border:1px solid var(--line);
  }
  .stat-box .num{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--chili-dark);}
  .stat-box .lbl{font-size:10.5px;color:#7a5c30;margin-top:2px;}

  .cat-item{
    display:flex;align-items:center;gap:8px;
    padding:6px 8px;border-radius:8px;cursor:pointer;
    font-size:12.5px;margin-bottom:2px;
    border:1px solid transparent;
  }
  .cat-item:hover{background:var(--paper-2);}
  .cat-item.disabled{opacity:0.35;}
  .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .cat-name{flex:1;}
  .cat-count{font-size:10.5px;color:#8a6b3b;font-variant-numeric:tabular-nums;}

  .cat-actions{display:flex;gap:6px;margin-bottom:8px;}
  .cat-actions button{
    flex:1;font-size:10.5px;padding:5px 6px;border-radius:6px;border:1px solid var(--line);
    background:var(--paper-2);color:#6b4d20;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;
  }
  .cat-actions button:hover{background:var(--turmeric);color:#fff;border-color:var(--turmeric);}

  #search{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
    font-family:'Be Vietnam Pro',sans-serif;font-size:12.5px;background:var(--paper);
    margin-bottom:6px;
  }
  #search:focus{outline:2px solid var(--turmeric);}

  #map{flex:1;min-width:0;}

  .leaflet-popup-content-wrapper{
    background:var(--card);border-radius:10px;
    box-shadow:0 6px 20px rgba(36,22,8,0.25);
  }
  .leaflet-popup-tip{background:var(--card);}
  .popup-cat{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;
    color:#fff;padding:2px 8px;border-radius:20px;margin-bottom:6px;
  }
  .popup-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;margin:0 0 4px;color:var(--ink);}
  .popup-addr{font-size:11.5px;color:#6b5636;margin-bottom:6px;line-height:1.4;}
  .popup-meta{display:flex;gap:12px;font-size:12px;color:var(--ink);}
  .popup-meta b{color:var(--chili-dark);}

  .legend-note{font-size:10.5px;color:#8a6b3b;line-height:1.5;margin-top:4px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  @media (max-width:760px){
    #sidebar{position:absolute;z-index:1000;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.2s;box-shadow:8px 0 20px rgba(0,0,0,.25);}
    #sidebar.open{transform:translateX(0);}
    #toggleSidebar{display:inline-flex !important;}
    .brand h1{font-size:16px;}
    .brand .sub{display:none;}
  }
  #toggleSidebar{
    display:none;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:8px;border:1px solid #4d3018;
    background:#3a2412;color:#e7d6b6;font-size:16px;cursor:pointer;
  }

  .marker-pin{
    width:16px;height:16px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .cluster-icon{
    background:var(--chili);color:#fff;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    border:3px solid #fff2df;box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <button id="toggleSidebar">☰</button>
      <h1>be<span>Food</span> · Bản đồ quán ăn</h1>
      <span class="sub">Trực quan hoá vị trí quán ăn theo thành phố</span>
    </div>
    <div class="citytabs">
      <button id="btnHN" data-city="0">Hà Nội</button>
      <button id="btnHCM" data-city="1" class="active">TP. Hồ Chí Minh</button>
    </div>
  </header>
  <div id="main">
    <div id="sidebar">
      <input id="search" type="text" placeholder="🔍 Tìm theo tên quán / khu vực..." />

      <h2>Tổng quan</h2>
      <div class="stat-row">
        <div class="stat-box"><div class="num" id="statCount">-</div><div class="lbl">quán đang hiển thị</div></div>
        <div class="stat-box"><div class="num" id="statRating">-</div><div class="lbl">rating trung bình</div></div>
      </div>

      <h2>Ngành hàng</h2>
      <div class="cat-actions">
        <button id="catAll">Chọn tất cả</button>
        <button id="catNone">Bỏ chọn</button>
      </div>
      <div id="catList"></div>
      <div class="legend-note">Bấm vào một nhóm để ẩn/hiện trên bản đồ. Màu chấm tương ứng với màu marker.</div>
    </div>
    <div id="map"></div>
  </div>
</div>

<script>
// RESTAURANTS: array of [name, lat, lon, category, rating, review_count, cityFlag(1=HCM,0=HN), address]
const CAT_COLORS = {
  "Cà Phê/Trà":"#6f4e2c",
  "Cơm/Cơm tấm":"#d5451b",
  "Bún/Phở/Mỳ/Cháo":"#a8330f",
  "Sinh tố/Nước ép/Sữa":"#3e7a4d",
  "Thức ăn nhanh":"#f2a007",
  "Ăn vặt":"#c2185b",
  "Ẩm thực quốc tế":"#3f51b5",
  "Trà sữa":"#8e5fb0",
  "Món truyền thống/Đặc sản":"#b8860b",
  "Bánh Mì/Xôi":"#e07a1f",
  "Tráng miệng":"#e91e63",
  "Lẩu & Nướng":"#c0392b",
  "Pizza":"#d84315",
  "Ốc/Cá/Hải sản":"#0288a8",
  "Món chay":"#43913e",
  "Mart":"#607d8b",
  "Món Dinh dưỡng/Bổ dưỡng":"#009688"
};
function colorFor(cat){ return CAT_COLORS[cat] || "#999"; }

let currentCity = 1; // 1 = HCM, 0 = HN
let activeCats = new Set(Object.keys(CAT_COLORS));
let searchTerm = "";

const map = L.map('map', {preferCanvas:true, zoomControl:true}).setView([10.7769, 106.7009], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 19
}).addTo(map);

let markerCluster = L.markerClusterGroup({
  maxClusterRadius: 45,
  iconCreateFunction: function(cluster){
    const count = cluster.getChildCount();
    let size = 32;
    if(count > 500) size = 52;
    else if(count > 100) size = 44;
    else if(count > 20) size = 38;
    return L.divIcon({
      html: `<div class="cluster-icon" style="width:${size}px;height:${size}px;font-size:${size>44?14:11}px;">${count}</div>`,
      className: '',
      iconSize: [size,size]
    });
  }
});
map.addLayer(markerCluster);

function makeIcon(cat){
  const c = colorFor(cat);
  return L.divIcon({
    className:'',
    html:`<div class="marker-pin" style="background:${c}"></div>`,
    iconSize:[16,16],
    iconAnchor:[8,16],
    popupAnchor:[0,-14]
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildPopup(r){
  const [name, lat, lon, cat, rating, rc, city, addr] = r;
  const c = colorFor(cat);
  return `<div>
    <span class="popup-cat" style="background:${c}">${escapeHtml(cat)}</span>
    <div class="popup-name">${escapeHtml(name)}</div>
    <div class="popup-addr">${escapeHtml(addr)}</div>
    <div class="popup-meta">⭐ <b>${rating ?? '—'}</b> &nbsp;·&nbsp; 💬 ${rc ?? 0} đánh giá</div>
  </div>`;
}

function render(){
  markerCluster.clearLayers();
  const term = searchTerm.trim().toLowerCase();
  let shown = 0;
  let ratingSum = 0, ratingN = 0;
  const layers = [];
  for(const r of RESTAURANTS){
    const [name, lat, lon, cat, rating, rc, city, addr] = r;
    if(city !== currentCity) continue;
    if(!activeCats.has(cat)) continue;
    if(term && !(name.toLowerCase().includes(term) || (addr||'').toLowerCase().includes(term))) continue;
    const m = L.marker([lat, lon], {icon: makeIcon(cat)});
    m.bindPopup(buildPopup(r));
    layers.push(m);
    shown++;
    if(typeof rating === 'number'){ ratingSum += rating; ratingN++; }
  }
  markerCluster.addLayers(layers);
  document.getElementById('statCount').textContent = shown.toLocaleString('vi-VN');
  document.getElementById('statRating').textContent = ratingN ? (ratingSum/ratingN).toFixed(2) : '—';
}

function buildCatList(){
  // count per category for current city
  const counts = {};
  for(const r of RESTAURANTS){
    if(r[6] !== currentCity) continue;
    counts[r[3]] = (counts[r[3]]||0)+1;
  }
  const list = document.getElementById('catList');
  list.innerHTML = '';
  const cats = Object.keys(CAT_COLORS).sort((a,b)=> (counts[b]||0)-(counts[a]||0));
  for(const cat of cats){
    const div = document.createElement('div');
    div.className = 'cat-item' + (activeCats.has(cat) ? '' : ' disabled');
    div.innerHTML = `<span class="cat-dot" style="background:${colorFor(cat)}"></span><span class="cat-name">${escapeHtml(cat)}</span><span class="cat-count">${counts[cat]||0}</span>`;
    div.onclick = () => {
      if(activeCats.has(cat)) activeCats.delete(cat); else activeCats.add(cat);
      buildCatList();
      render();
    };
    list.appendChild(div);
  }
}

document.getElementById('btnHN').onclick = () => switchCity(0);
document.getElementById('btnHCM').onclick = () => switchCity(1);
function switchCity(city){
  currentCity = city;
  document.getElementById('btnHN').classList.toggle('active', city===0);
  document.getElementById('btnHCM').classList.toggle('active', city===1);
  map.setView(city===0 ? [21.0278, 105.8342] : [10.7769, 106.7009], 12);
  buildCatList();
  render();
}

document.getElementById('catAll').onclick = () => { activeCats = new Set(Object.keys(CAT_COLORS)); buildCatList(); render(); };
document.getElementById('catNone').onclick = () => { activeCats = new Set(); buildCatList(); render(); };

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  render();
});

document.getElementById('toggleSidebar').onclick = () => {
  document.getElementById('sidebar').classList.toggle('open');
};

buildCatList();
render();
</script>
